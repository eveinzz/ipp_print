name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.0
          channel: stable
          cache: true
      - run: flutter pub get
      # 格式门（0.7.2）：内容与空白分离，格式漂移不进主干。
      - name: Format gate
        run: dart format --output=none --set-exit-if-changed lib test example
      # 版本链闸（0.7.2）：独立于 version_consistency_test.dart 复核 podspec，
      # 防止测试文件被误改后一致性失守（同类漂移已复发两次）。
      - name: Version consistency (pubspec <-> podspecs)
        run: |
          set -eu
          pub_version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          for podspec in ios/ipp_print.podspec macos/ipp_print.podspec; do
            pod_version=$(grep -m1 's\.version' "$podspec" | sed "s/.*'\([^']*\)'.*/\1/")
            if [ "$pod_version" != "$pub_version" ]; then
              echo "::error file=$podspec::podspec version '$pod_version' != pubspec '$pub_version'"
              exit 1
            fi
          done
          echo "version chain OK: $pub_version"
      - run: flutter analyze
      - run: flutter test

  commit-message-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要历史以取推送区间；浅克隆拿不到 before 提交。
          fetch-depth: 0
      # 规范闸（0.7.5）：提交信息一律英文 —— 仓库历史 43 条全英文，0.7.4 混入过
      # 一条中文（已改写）。与本地钩子共用同一脚本 .githooks/commit-msg，
      # 单实现两入口，避免「同契约双实现漂移」。
      # 注意：本闸只约束「提交信息」；代码注释与双语文档不受影响。
      - name: Commit messages must be English (no CJK)
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git rev-parse --verify -q "$base" >/dev/null 2>&1; then
            echo "base '$base' unknown (first push / force push) -> checking full history"
            base=""
          fi
          python3 .githooks/commit-msg --range "${base:+$base..}HEAD"
