name: ipp_print
description: >-
  IPP direct printing for Flutter/Dart: find and print on printers the OS
  print panel (AirPrint) rejects. Bonjour TXT classification, IPP 1.1,
  PWG-raster. Pure Dart, no UI.
version: 0.1.0
# 发布日移除本行（当前保持禁发，防误发布）。
publish_to: none
repository: https://github.com/eveinzz/ipp_print
issue_tracker: https://github.com/eveinzz/ipp_print/issues
topics:
  - printing
  - ipp
  - printer
  - mdns
  - airprint
  - bonjour
  - dns-sd

environment:
  sdk: ^3.4.0

dependencies:
  multicast_dns: ^0.3.2+7

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
