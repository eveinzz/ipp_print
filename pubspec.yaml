name: ipp_print
description: >-
  IPP direct printing for Flutter: find and print on printers the OS
  print panel (AirPrint) rejects. Native Bonjour discovery on iOS/macOS
  (no multicast entitlement), mDNS elsewhere. IPP 1.1, PWG-raster, no UI.
version: 0.7.4
# 发布日移除本行（当前保持禁发，防误发布）。
publish_to: none
repository: https://github.com/eveinzz/ipp_print
issue_tracker: https://github.com/eveinzz/ipp_print/issues
topics:
  - printing
  - ipp
  - printer
  - mdns
  - airprint
  - bonjour
  - dns-sd

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.12.0
  multicast_dns: ^0.3.2+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  test: ^1.25.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IppPrintPlugin
      macos:
        pluginClass: IppPrintPlugin
